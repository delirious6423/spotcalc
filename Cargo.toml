[package]
name = "spotcalc"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Spotlight-style calculator popup for Linux: hotkey, type, Enter copies the result"
license = "Apache-2.0"
repository = "https://github.com/delirious6423/spotcalc"
readme = "README.md"
keywords = ["calculator", "launcher", "spotlight", "gnome", "units"]
categories = ["gui", "mathematics"]
publish = false

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
fend-core = "1.5.8"
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
unwrap_used = "warn"
