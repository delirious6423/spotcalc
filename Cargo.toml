[package]
name = "spotcalc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
fend-core = "1.5.8"
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.clippy]
unwrap_used = "warn"
