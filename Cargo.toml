[package]
name = "spotcalc"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
description = "Spotlight-style calculator popup for Linux, with units and currencies"
license = "Apache-2.0"
repository = "https://github.com/delirious6423/spotcalc"
readme = "README.md"
keywords = ["calculator", "launcher", "spotlight", "gnome", "units"]
categories = ["gui", "mathematics"]
publish = false

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.35.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
fend-core = "1.5.8"
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
unwrap_used = "warn"

# Debian/Ubuntu package, built by scripts/package.sh with cargo-deb
# (https://github.com/kornelski/cargo-deb). Files under dist/licenses/ are generated by that
# script, so run it rather than plain `cargo deb`.
[package.metadata.deb]
maintainer = "spotcalc contributors <335583626+delirious6423@users.noreply.github.com>"
copyright = "2026 spotcalc contributors"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
# $auto only sees linked libraries (libc). winit and glutin dlopen the rest at runtime:
# Wayland + EGL, and the X11 fallback.
depends = """$auto, libegl1, libwayland-client0, libwayland-egl1, libxkbcommon0, \
libx11-6, libx11-xcb1, libxcb1, libxcursor1, libxi6, libxkbcommon-x11-0, libxrender1"""
recommends = "fonts-dejavu-core"
extended-description = """\
Press a hotkey, type a calculation, and read the answer as you type; Enter copies it. \
Handles units, currencies with daily exchange rates, percentages, number bases and \
variables. On first launch it offers to set up an Alt+Space shortcut on GNOME."""
assets = [
    ["target/release/spotcalc", "usr/bin/", "755"],
    ["assets/spotcalc.desktop", "usr/share/applications/", "644"],
    ["assets/spotcalc.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/spotcalc/", "644"],
    ["NOTICE", "usr/share/doc/spotcalc/", "644"],
    ["dist/licenses/THIRD_PARTY_LICENSES.txt", "usr/share/doc/spotcalc/", "644"],
    ["dist/licenses/fonts/*.txt", "usr/share/doc/spotcalc/fonts/", "644"],
]
